<h2>{{title}}</h2>
<form [formGroup]="loginForma" class="example-form">
    <div>
        <mat-form-field class="example-full-width">
            <mat-label>Username</mat-label>
            <input matInput name="username" formControlName="username" type="text" required>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field class="example-full-width">

            <mat-label>Password</mat-label>
            <input matInput name="password" formControlName="password" type="password" required>
        </mat-form-field>
    </div>

    <div class="example-label">
        <div class="example-button-row">
            <button mat-flat-button color="elevated"(click)="login()" type="submit">Login</button>
            <button mat-stroked-button color="elevated" *ngIf="loginService.user"
                (click)="loginService.logout()">Logout</button>
        </div>
    </div>
</form>
<p *ngIf="loginFailed">Login failed!</p>
<p *ngIf="loginService.loggedOut">Successfully logged out!</p>
